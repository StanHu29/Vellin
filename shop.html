<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop – Vellin</title>
<link rel="stylesheet" href="CSS/style.css">
<script type="module" src="js/app.js" defer></script>
</head>
<body>

<nav>
  <a href="dashboard.html">Dashboard</a>
  <a href="klachten.html">Klachten</a>
  <a href="shop.html">Shop</a>
  <a href="chatbot.html">Chatbot</a>
</nav>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Shop</h1>
      <p class="page-subtitle">Ontdek onze chocoladeproducten</p>
    </div>
    <button class="icon-button" aria-label="Cart">🛒<span class="icon-badge">1</span></button>
  </div>

  <div class="search-bar">
    <input type="search" id="shopSearch" placeholder="Search products..." oninput="updateShopFilter()">
  </div>

  <div class="pill-filters" id="shopFilters">
    <button type="button" class="pill active" data-filter="all" onclick="updateShopFilter(this)">All</button>
    <button type="button" class="pill" data-filter="seasonal" onclick="updateShopFilter(this)">Seasonal</button>
    <button type="button" class="pill" data-filter="limited" onclick="updateShopFilter(this)">Limited Edition</button>
    <button type="button" class="pill" data-filter="fairtrade" onclick="updateShopFilter(this)">Fairtrade</button>
  </div>

  <div class="product-grid" id="shopProducten"></div>
  <div id="orderResultaat"></div>
</div>
<footer class="bottom-nav">
  <a href="dashboard.html"><span>🏠</span><span>Home</span></a>
  <a href="shop.html" class="active"><span>🛍️</span><span>Shop</span></a>
  <a href="dashboard.html"><span>📚</span><span>Library</span></a>
  <a href="klachten.html"><span>🎧</span><span>Service</span></a>
  <a href="chatbot.html"><span>⚙️</span><span>Settings</span></a>
</footer>

</body>
</html>
