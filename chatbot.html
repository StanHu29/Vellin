<div class="container">
  <h1>AI Chatbot</h1>
  <p style="color:#888;">Stel 24/7 vragen over producten, allergenen, bestellingen en klachten.</p>

  <div class="chat-box" id="chatBox">
    <div class="chat-bericht-bot">
      Hallo! Ik ben de Vellin assistent  Waarmee kan ik je helpen? Je kunt vragen stellen over producten, allergenen, bestellingen of klachten.
    </div>
  </div>

  <div class="chat-invoer">
    <input type="text" id="vraag" placeholder="Typ je vraag..." onkeydown="if(event.key==='Enter') vraagBot()">
    <button onclick="vraagBot()">Versturen</button>
  </div>
</div>

</body>
