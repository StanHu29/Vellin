<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Product</title>

<link rel="stylesheet" href="CSS/style.css">

<style>

.register-page{
    padding-bottom:120px;
}

.register-hero{
    position:relative;
    height:220px;
    overflow:hidden;
    border-radius:0 0 30px 30px;
}

.register-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.register-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.55),
        rgba(0,0,0,.15)
    );
}

.register-content{
    position:absolute;
    left:25px;
    bottom:25px;
    color:white;
}

.register-content h1{
    margin:0;
    font-size:34px;
}

.register-content p{
    margin-top:8px;
    opacity:.9;
}

.scan-card{
    background:white;
    margin:20px;
    border-radius:28px;
    padding:24px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.scan-box{
    height:240px;
    border:3px dashed #d8c7b8;
    border-radius:24px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    margin-bottom:20px;
}

.scan-icon{
    font-size:60px;
    margin-bottom:15px;
}

.scan-btn{
    width:100%;
    border:none;
    background:#6d3519;
    color:white;
    padding:16px;
    border-radius:16px;
    font-size:16px;
    cursor:pointer;
}

.divider{
    text-align:center;
    margin:30px 20px;
    color:#999;
    font-weight:600;
}

.form-card{
    background:white;
    margin:20px;
    padding:24px;
    border-radius:28px;
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:16px;
    border:1px solid #ddd;
    border-radius:14px;
    box-sizing:border-box;
    font-size:15px;
}

.register-btn{
    width:100%;
    border:none;
    background:#6d3519;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.register-btn:hover{
    opacity:.95;
}
.success-modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.45);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;
}

.success-modal.active{
    display:flex;
}

.success-card{

    background:white;

    width:320px;

    border-radius:28px;

    padding:30px;

    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,.15);

}

.success-icon{

    width:70px;
    height:70px;

    margin:auto;

    border-radius:50%;

    background:#e8f8ed;

    color:#28a745;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    font-weight:bold;

    margin-bottom:15px;

}

.success-card h2{
    margin-bottom:10px;
}

.success-card p{
    color:#777;
    margin-bottom:20px;
}

.success-card button{

    width:100%;

    border:none;

    background:#6d3519;

    color:white;

    padding:14px;

    border-radius:14px;

    cursor:pointer;

}

</style>

</head>
<body>

<div class="app register-page">

<header class="topbar">
    <div class="brand-header">
        <img src="images/ChatGPT Image Jun 3, 2026, 12_13_49 AM.png"
             alt="Chocolate Firm"
             class="logo-sm">

        <h1 class="app-title">
            Chocolate Firm
        </h1>
    </div>
</header>

<main>

<section class="register-hero">

    <img src="images/my_collection_hero.jpg"
         alt="Register Product">

    <div class="register-overlay"></div>

    <div class="register-content">

        <h1>Register Product</h1>

        <p>
            Add a chocolate product to your collection
        </p>

    </div>

</section>

<div class="scan-card">

    <div class="scan-box">

        <div class="scan-icon">📷</div>

        <h3>Scan QR Code</h3>

        <p>
            Point your camera at the product QR code
        </p>

    </div>

    <button class="scan-btn">
        Start Scanning
    </button>

</div>

<div class="divider">

    ───── OR ENTER MANUALLY ─────

</div>

<div class="form-card">

    <div class="form-group">

        <label>Batch Number</label>

        <input
id="batchNumber"
type="text"
placeholder="Enter batch number">

    </div>

    <div class="form-group">

        <label>Product Code</label>

        <input
id="productCode"
type="text"
placeholder="Enter product code">

    </div>

    <div class="form-group">

        <label>Receipt Number</label>

        <input
         id="receiptNumber"
         type="text"
         placeholder="Enter receipt number">

    </div>

    <button
id="registerBtn"
class="register-btn">

        + Register Product

    </button>

</div>

</main>
<div id="successModal" class="success-modal">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <h2>Product Registered!</h2>

        <p>
            Your product has been added to your collection.
        </p>

        <button onclick="goToCollection()">
            View Collection
        </button>

    </div>

</div>

<script>

document
.getElementById("registerBtn")
.addEventListener("click", function(){

    const batch =
    document.getElementById("batchNumber").value;

    const product =
    document.getElementById("productCode").value;

    const receipt =
    document.getElementById("receiptNumber").value;

    if(
        !batch ||
        !product ||
        !receipt
    ){
        showError("Please fill in all fields.");
        return;
    }

    const newProduct = {

        name: product,

        batch: batch,

        receipt: receipt,

        expiry: "New Product",

        origin: "Registered Product"

    };

    let products =
    JSON.parse(
        localStorage.getItem("products")
    ) || [];

    products.push(newProduct);

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );
    function showError(message){

    alert(message);

}
    showSuccess();
});


function showSuccess(){

    document
    .getElementById("successModal")
    .classList.add("active");

}

function goToCollection(){

    window.location.href =
    "mychocolate.html";

}

</script>
</body>
</html>
