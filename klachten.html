<div class="container">
  <h1>Klacht indienen</h1>
  <p style="color:#888;">Vul het formulier in. We reageren binnen 1 werkdag.</p>

  <span class="label">Onderwerp</span>
  <input type="text" id="onderwerp" placeholder="Bijv. beschadigd product, verkeerde levering...">

  <span class="label">Beschrijving</span>
  <textarea id="beschrijving" rows="5" placeholder="Beschrijf het probleem zo duidelijk mogelijk..."></textarea>

  <span class="label">Productcode (optioneel)</span>
  <input type="text" id="klachtProductCode" placeholder="Bijv. CHOC-001">

  <br><br>
  <button onclick="verstuurKlacht()">Klacht versturen</button>

  <div id="klachtStatus"></div>
</div>
