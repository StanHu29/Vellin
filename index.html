<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chocolate Firm Login</title>
<link rel="stylesheet" href="CSS/style.css">
<script type="module" src="js/app.js" defer></script>
</head>

<body>

<div class="container">
  <main class="hero-section">
    <div class="hero-copy">
      <span class="hero-eyebrow">Welcome Back, Chocolate Lover</span>
      <h1 class="hero-title">Access your registered products, cocoa journeys and exclusive deals.</h1>
    </div>

    <aside class="login-card">
      <div class="panel-head">
        <p class="panel-label">Log in</p>
        <h2>Login</h2>
      </div>
      <div class="auth-card">
        <input type="email" id="email" placeholder="Email address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div class="form-row">
          <label><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <p class="auth-footer">Don't have an account? <a href="register.html">Register here</a></p>
      </div>
    </aside>
  </main>
</div>

</body>
</html>
