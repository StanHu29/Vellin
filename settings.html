<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellin – Instellingen</title>
<link rel="stylesheet" href="CSS/style.css">
<style>
.instellingen-hero {
  height: 180px;
  border-radius: 0 0 32px 32px;
  overflow: hidden;
  position: relative;
  margin-bottom: 0;
}
.instellingen-hero .hero-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.instellingen-hero .hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.3), rgba(0,0,0,.05));
}
.instellingen-naam {
  font-size: 34px;
  margin: 0;
  line-height: 1;
  color: white;
  font-family: 'Playfair Display', serif;
}
.instellingen-omschrijving {
  margin-top: 6px;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.85);
}

.profiel-kaart {
  background: white;
  border-radius: 24px;
  padding: 20px;
  margin: 16px 16px 0;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
}
.profiel-avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #5a3e2a);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 700;
  flex-shrink: 0;
  font-family: 'Playfair Display', serif;
}
.profiel-info h3 { margin: 0 0 2px; font-size: 1rem; color: var(--primary); }
.profiel-info p { margin: 0 0 6px; color: var(--text-secondary); font-size: 0.85rem; }
.lid-badge {
  display: inline-block;
  background: linear-gradient(135deg, #f4e2c7, #e8c99a);
  color: var(--primary);
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.05em;
}

.instellingen-lijst {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 16px 0;
}
.instelling-item {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  width: 100%;
  font-family: inherit;
  transition: background 0.2s;
}
.instelling-item:active { background: #f8f6f3; }
.instelling-item h4 { margin: 0 0 2px; font-size: 0.9rem; color: var(--primary); }
.instelling-item p { margin: 0; color: var(--text-secondary); font-size: 0.78rem; }
.instelling-pijl { font-size: 1.3rem; color: #bbb; }

.uitloggen-sectie {
  padding: 16px;
  margin-top: 8px;
}
.btn-uitloggen {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--primary), #5a3e2a);
  color: white;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.2s;
}
.btn-uitloggen:active { transform: scale(0.98); }
</style>
<script type="module" src="js/app.js" defer></script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-header">
      <img src="images/ChatGPT Image Jun 3, 2026, 12_13_49 AM.png" alt="Vellin" class="logo-sm">
      <h1 class="app-title">Vellin</h1>
    </div>
  </header>

  <main class="feed" style="padding-bottom:100px;">
    <section class="hero-welcome instellingen-hero">
      <img class="hero-bg" src="images/hero-chocolate.png" alt="Achtergrond">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h2 class="instellingen-naam">Sarah Johnson</h2>
        <p class="instellingen-omschrijving">Beheer je account en voorkeuren</p>
      </div>
    </section>

    <div class="profiel-kaart">
      <div class="profiel-avatar">SJ</div>
      <div class="profiel-info">
        <h3>Sarah Johnson</h3>
        <p>sarah@vellin.nl</p>
        <span class="lid-badge">⭐ Premium Lid</span>
      </div>
    </div>

    <div class="instellingen-lijst">
      <button class="instelling-item">
        <div>
          <h4>Profiel Bewerken</h4>
          <p>Persoonlijke gegevens aanpassen</p>
        </div>
        <span class="instelling-pijl">›</span>
      </button>

      <button class="instelling-item">
        <div>
          <h4>Meldingen</h4>
          <p>Beheer waarschuwingen en updates</p>
        </div>
        <span class="instelling-pijl">›</span>
      </button>

      <button class="instelling-item">
        <div>
          <h4>Taal</h4>
          <p>Nederlands</p>
        </div>
        <span class="instelling-pijl">›</span>
      </button>

      <button class="instelling-item">
        <div>
          <h4>Privacy & Beveiliging</h4>
          <p>Accountbeveiliging beheren</p>
        </div>
        <span class="instelling-pijl">›</span>
      </button>

      <button class="instelling-item">
        <div>
          <h4>Over de App</h4>
          <p>Versie 1.0.0</p>
        </div>
        <span class="instelling-pijl">›</span>
      </button>
    </div>

    <div class="uitloggen-sectie">
      <button class="btn-uitloggen" onclick="uitloggen()">Uitloggen</button>
    </div>

    <div class="spacer"></div>
  </main>

  <!-- Onderste navigatie -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <img class="nav-icon" src="images/home.png" alt="Home">
      <span class="nav-label">Home</span>
    </a>
    <a href="shop.html" class="nav-item">
      <img class="nav-icon" src="images/shop.png" alt="Winkel">
      <span class="nav-label">Winkel</span>
    </a>
    <a href="mychocolate.html" class="nav-item">
      <img class="nav-icon" src="images/orders.png" alt="Mijn Producten">
      <span class="nav-label">Mijn Producten</span>
    </a>
    <a href="klachten.html" class="nav-item">
      <img class="nav-icon" src="images/service.png" alt="Service">
      <span class="nav-label">Service</span>
    </a>
    <a href="settings.html" class="nav-item active">
      <img class="nav-icon" src="images/settings.png" alt="Instellingen">
      <span class="nav-label">Instellingen</span>
    </a>
  </nav>
</div>
</body>
</html>
